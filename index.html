<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Carta Digital — El Pollón, pollo a la brasa." />
    <meta name="theme-color" content="#ffffff" />
    <title>Carta Digital | El Pollón</title>

    <!-- Conexión rápida al CDN de imágenes -->
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />

    <!-- Fuente: carga sin bloquear la pantalla -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap"
      />
    </noscript>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="splash" aria-label="Presentación Carta Digital El Pollón">
      <header class="splash-header">
        <h1 class="splash-title">
          <span class="title-carta">CARTA</span>
          <span class="title-digital">DIGITAL</span>
        </h1>
      </header>

      <div class="splash-brand" aria-label="Logo El Pollón">
        <img
          class="brand-logo"
          src=""
          alt="El Pollón — Restaurante Pollería"
          width="270"
          height="150"
          decoding="async"
          fetchpriority="high"
        />
      </div>

      <section class="carousel-section" aria-label="Presentación de platos">
        <div class="carousel-scene">
          <div class="carousel-stage" id="carousel-stage"></div>
          <div class="carousel-floor" id="carousel-floor" aria-hidden="true"></div>
          <div class="carousel-glow" aria-hidden="true"></div>
        </div>
      </section>

      <footer class="splash-footer">
        <a
          class="btn-ingresar"
          href="https://www.el-pollon.cl"
          target="_blank"
          rel="noopener noreferrer"
        >
          INGRESAR
        </a>
      </footer>
    </main>

    <script src="js/config.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
